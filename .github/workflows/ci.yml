# Baseline CI — seeded once by socket-wheelhouse (template/presets/), then
# repo-owned: edit freely. Runs check + test via the LOCAL composite actions
# under .github/actions/fleet/ (cascade-updated), referenced by ./ path — no
# cross-repo reusable workflow, no first-party `uses:@sha`. Add repo-specific
# jobs anywhere under `jobs:`.
name: ⚡ CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fleet no-phone-home posture: the setup action exports every FLEET_ENV knob at
# runtime from .github/actions/fleet/setup/fleet-env.json, which is THE one list
# the shell-rc bridge, telemetry-env-is-disabled.mts and spawned agents all
# derive from. Declaring them workflow-level as well is a second copy that
# drifts from that list, which is what workflow-env-is-action-supplied flags.

jobs:
  # First step of every job is the third-party actions/checkout (GitHub fetches
  # it independently) to populate the workspace so the LOCAL `./.github/actions/*`
  # composites resolve. setup-and-install then re-checks-out — full history
  # (fetch-depth 0) in the check job, since the commit-history checks it runs
  # (AI-attribution, release-boundary) read the default branch's history and
  # refuse a shallow clone rather than false-green; the test matrix stays at
  # the default depth (25 — covers CI's other git operations) and runs the
  # zizmor Actions audit (its own `strategy.job-total < 2` skip runs it in the
  # non-matrix check job, skips it in the test matrix).
  check:
    name: 🔎 Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # First step cannot call the local ./.github/actions/fleet/checkout
      # composite - nothing is checked out yet for GitHub to resolve
      # `./.github/actions/*` from - so the workspace is bootstrapped with the
      # same inline git-fetch shape, non-persisting auth.
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_REF: ${{ github.ref }}
          FETCH_DEPTH: '1'
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          FETCH_ARGS=(--no-tags --prune --depth "${FETCH_DEPTH}" origin "${TRIGGER_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" fetch "${FETCH_ARGS[@]}"
          else
            git fetch "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD
      - uses: ./.github/actions/fleet/setup-and-install
        with:
          # Full history: the commit-history checks (AI-attribution,
          # release-boundary) read the default branch's history and refuse a
          # shallow clone rather than false-green.
          checkout-fetch-depth: '0'
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          # Thin-distribution CI auth: mint a contents:read-only token so the
          # bootstrap fetch (fired by `prepare` during install) can download the
          # fleet release bundle from the private wheelhouse. Both refs are
          # empty on a non-thin member (var/secret unset) - the mint is skipped
          # and the fetch no-ops. A thin member sets a dedicated read-only App's
          # client-id var + private-key secret.
          payload-token-client-id: ${{ vars.SOCKET_PAYLOAD_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_PAYLOAD_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/fleet/run-script
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          setup-script: pnpm run build
          main-script: pnpm run check --all

  test:
    name: 🧪 Test
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # JS/TS tests only need a fast Linux run; cross-platform behavior is
        # covered by unit tests, not the CI matrix.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Depth: 1 is enough to run the full suite, but `pnpm test --ci` needs a
      # merge base to diff against, and a one-commit clone has none. Deepen on
      # a pull request only; every other event runs `--all`, which needs no
      # history at all and keeps the cheap depth-1 fetch.
      # First step cannot call the local ./.github/actions/fleet/checkout
      # composite - nothing is checked out yet for GitHub to resolve
      # `./.github/actions/*` from - so the workspace is bootstrapped with the
      # same inline git-fetch shape, non-persisting auth.
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_REF: ${{ github.ref }}
          FETCH_DEPTH: ${{ github.event_name == 'pull_request' && 50 || 1 }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          FETCH_ARGS=(--no-tags --prune --depth "${FETCH_DEPTH}" origin "${TRIGGER_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" fetch "${FETCH_ARGS[@]}"
          else
            git fetch "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD
      # The base branch as a remote-tracking ref, so resolveCiBaseRef can find
      # it. A failure here is NOT fatal: with no base ref the scope decision
      # escalates to the full suite, which is the safe answer.
      - name: Fetch the base branch for the diff
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth 50 origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" || true
      - uses: ./.github/actions/fleet/setup-and-install
        with:
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          # Thin-distribution CI auth: mint a contents:read-only token so the
          # bootstrap fetch (fired by `prepare` during install) can download the
          # fleet release bundle from the private wheelhouse. Both refs are
          # empty on a non-thin member (var/secret unset) - the mint is skipped
          # and the fetch no-ops. A thin member sets a dedicated read-only App's
          # client-id var + private-key secret.
          payload-token-client-id: ${{ vars.SOCKET_PAYLOAD_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_PAYLOAD_APP_PRIVATE_KEY }}
      - uses: ./.github/actions/fleet/run-script
        env:
          # Authenticate build-time GitHub API reads (release listings,
          # prebuilt-artifact downloads). Unauthenticated calls share the
          # hosted runner's IP-scoped rate limit and 403 under load.
          GH_TOKEN: ${{ github.token }}
        with:
          setup-script: pnpm run build
          # A pull request tests only what its diff touches; main and tags run
          # the whole suite, because main is the commit a release cut verifies
          # green and that guarantee should not depend on a diff being computed
          # correctly. `--ci` escalates to the full suite by itself whenever it
          # cannot work out the diff, so a shallow clone or a missing base ref
          # costs CI minutes rather than coverage.
          main-script:
            ${{ github.event_name == 'pull_request' && 'pnpm run test --ci' ||
            'pnpm run test --all' }}

  # Coverage gate. Runs on main pushes, tags and dispatch -- NOT on pull
  # requests: the sweep is ~15 min, and main is what a release cuts from.
  #
  # This job is the reason .config/repo/socket-wheelhouse.json now carries a
  # `cover.thresholds` block. Without thresholds, computeThresholdFailures
  # returns no failures by construction, so `pnpm run cover` printed its
  # percentages and exited 0 no matter how far coverage had fallen -- a gate
  # that reports rather than gates. The floors are set at the measured
  # aggregate, so they hold the line and are meant to be raised as it climbs.
  cover:
    name: 📊 Cover
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # First step cannot call the local ./.github/actions/fleet/checkout
      # composite - nothing is checked out yet for GitHub to resolve
      # `./.github/actions/*` from - so the workspace is bootstrapped with the
      # same inline git-fetch shape, non-persisting auth.
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_REF: ${{ github.ref }}
          FETCH_DEPTH: '1'
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          FETCH_ARGS=(--no-tags --prune --depth "${FETCH_DEPTH}" origin "${TRIGGER_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" fetch "${FETCH_ARGS[@]}"
          else
            git fetch "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD
      - uses: ./.github/actions/fleet/setup-and-install
        with:
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          payload-token-client-id: ${{ vars.SOCKET_PAYLOAD_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_PAYLOAD_APP_PRIVATE_KEY }}
      - id: coverage
        uses: ./.github/actions/fleet/run-script
        env:
          # cover builds with source maps first; authenticate its build-time
          # GitHub API reads, same as the test job.
          GH_TOKEN: ${{ github.token }}
        with:
          setup-script: pnpm run build
          main-script: pnpm run cover
      - name: Measure failed fast coverage lane
        if: failure() && steps.coverage.outcome == 'failure'
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cache/repo/coverage-diagnostics
          pnpm run cover --measure --lane fast 2>&1 | tee .cache/repo/coverage-diagnostics/fast.log
      - name: Mint diagnostic source read token
        id: diagnostic-source-token
        if: failure() && steps.coverage.outcome == 'failure'
        uses: ./.github/actions/fleet/github-payload-app-token
        with:
          client-id: ${{ vars.SOCKET_PAYLOAD_CLIENT_ID }}
          private-key: ${{ secrets.SOCKET_PAYLOAD_APP_PRIVATE_KEY }}
      - name: Measure demand-loaded network mocks
        if: failure() && steps.coverage.outcome == 'failure'
        timeout-minutes: 3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_TOKEN: ${{ steps.diagnostic-source-token.outputs.token }}
          CANONICAL_COMMIT: f9e90fc7f80f2682441d4938570c9d5c593f7431 # test-setup-demand-load
        run: |
          set -euo pipefail
          diagnostics=.cache/repo/coverage-diagnostics
          cp -R .cache/fleet/coverage/measurement "$diagnostics/control"
          cp test/fleet/scripts/setup.mts "$diagnostics/setup.before.mts"
          cp .config/repo/socket-wheelhouse.json "$diagnostics/settings.before.json"
          test ! -e test/fleet/_shared/lib/network-mocks.mts
          GH_TOKEN="$PAYLOAD_TOKEN" gh api "repos/SocketDev/socket-wheelhouse/contents/template/base/universal/test/fleet/scripts/setup.mts?ref=${CANONICAL_COMMIT}" --jq .content | base64 --decode > "$diagnostics/setup.candidate.mts"
          GH_TOKEN="$PAYLOAD_TOKEN" gh api "repos/SocketDev/socket-wheelhouse/contents/template/base/universal/test/fleet/_shared/lib/network-mocks.mts?ref=${CANONICAL_COMMIT}" --jq .content | base64 --decode > "$diagnostics/network-mocks.candidate.mts"
          printf '%s  %s\n' 7dce0c8b69ce693ec251382e842cc81e2edaf63077c0c22a8f6ece12bb77f967 "$diagnostics/setup.candidate.mts" 70db56b163d15b03dd35315d457402212600f9a6cd31b87785977df46f0a28df "$diagnostics/network-mocks.candidate.mts" | sha256sum --check
          cat > "$diagnostics/restore.mjs" <<'EOF'
          import assert from 'node:assert/strict'
          import { readFileSync, rmSync } from 'node:fs'
          import { writeThroughMirrorLock } from '../../../scripts/fleet/fs/mirror-lock.mts'
          const root = '.cache/repo/coverage-diagnostics'
          const original = readFileSync(`${root}/setup.before.mts`)
          writeThroughMirrorLock('test/fleet/scripts/setup.mts', original)
          rmSync('test/fleet/_shared/lib/network-mocks.mts', { force: true })
          assert.deepEqual(readFileSync('test/fleet/scripts/setup.mts'), original)
          assert.deepEqual(readFileSync('.config/repo/socket-wheelhouse.json'), readFileSync(`${root}/settings.before.json`))
          EOF
          trap 'node "$diagnostics/restore.mjs"' EXIT
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs'
          import { writeThroughMirrorLock } from './scripts/fleet/fs/mirror-lock.mts'
          const root = '.cache/repo/coverage-diagnostics'
          writeThroughMirrorLock('test/fleet/scripts/setup.mts', readFileSync(`${root}/setup.candidate.mts`))
          writeThroughMirrorLock('test/fleet/_shared/lib/network-mocks.mts', readFileSync(`${root}/network-mocks.candidate.mts`))
          EOF
          measurement_status=0
          pnpm run cover --measure --lane fast > "$diagnostics/candidate.log" 2>&1 || measurement_status=$?
          cp -R .cache/fleet/coverage/measurement "$diagnostics/candidate"
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict'
          import { readFileSync, writeFileSync } from 'node:fs'
          const root = '.cache/repo/coverage-diagnostics'
          const read = (variant, file) => JSON.parse(readFileSync(`${root}/${variant}/lane-fast/${file}`, 'utf8'))
          const hitChanges = { lost: [], gained: [] }
          for (const tier of ['main', 'isolated']) {
            const control = read('control', `tests.${tier}.json`)
            const candidate = read('candidate', `tests.${tier}.json`)
            for (const key of ['numTotalTests', 'numPassedTests', 'numFailedTests', 'numPendingTests']) {
              assert.equal(candidate[key], control[key], `${tier}:${key}`)
            }
            assert.deepEqual(candidate.testResults.map(test => test.name).sort(), control.testResults.map(test => test.name).sort())
            const original = read('control', `coverage-final.${tier}.json`)
            const changed = read('candidate', `coverage-final.${tier}.json`)
            assert.deepEqual(Object.keys(changed).sort(), Object.keys(original).sort())
            for (const path of Object.keys(original)) {
              for (const key of ['statementMap', 'fnMap', 'branchMap']) {
                assert.deepEqual(changed[path][key], original[path][key], `${tier}:${path}:${key}`)
              }
              for (const metric of ['s', 'f', 'b']) {
                for (const key of Object.keys(original[path][metric])) {
                  const before = [original[path][metric][key]].flat()
                  const after = [changed[path][metric][key]].flat()
                  before.forEach((count, index) => {
                    const location = { tier, path, metric, key, index }
                    if (count > 0 && after[index] === 0) hitChanges.lost.push(location)
                    if (count === 0 && after[index] > 0) hitChanges.gained.push(location)
                  })
                }
              }
            }
          }
          const comparison = { control: read('control', 'measurement.json'), candidate: read('candidate', 'measurement.json'), identicalTestInventory: true, identicalCoverageMaps: true, hitChanges }
          writeFileSync(`${root}/comparison.json`, JSON.stringify(comparison, null, 2) + '\n')
          EOF
          exit "$measurement_status"
      - name: Upload coverage diagnostics
        if: always() && steps.coverage.outcome == 'failure'
        uses: ./.github/actions/fleet/upload-artifact
        with:
          name: failed-coverage-diagnostics
          path: |
            .cache/repo/coverage-diagnostics
            .cache/fleet/coverage/measurement
            .cache/fleet/fleet-cover
          if-no-files-found: ignore
